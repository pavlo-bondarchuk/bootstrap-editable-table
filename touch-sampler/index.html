const pads=Array.from({length:8},(_,i)=>({id:i,name:`Pad ${i+1}`,blob:null,buffer:null,reversed:false,speed:1,volume:1,normalizeGain:1,filter:18000,trimStart:0,trimEnd:1,preset:'clean',mode:'loop',chokeGroup:0,fx:{reverb:false,echo:false,distortion:false,glitch:false},voices:new Map(),loopVoice:null}))

function stopAllVoices(p){for(const voiceId of [...p.voices.keys()])stopVoice(p,voiceId);if(p.loopVoice)stopLoop(p)}
function stopChokeGroup(p){if(!p.chokeGroup)return;pads.forEach(other=>{if(other.id!==p.id&&other.chokeGroup===p.chokeGroup)stopAllVoices(other)})}
async function startVoice(p,{pointerId=null,loop=false,kind='oneshot',offset=null}={}){if(!p.buffer)return null;await audioCtx.resume();stopChokeGroup(p);const start=trimA(p),end=trimB(p);if(end-start<.03)return null;const source=audioCtx.createBufferSource();source.buffer=p.reversed?createReverseBuffer(p.buffer):p.buffer;source.playbackRate.value=effectiveRate(p);const aa=p.reversed?duration(p)-end:start,bb=p.reversed?duration(p)-start:end;source.loop=loop;source.loopStart=aa;source.loopEnd=bb;const voiceId=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;const nodes=buildChain(p,source);const voice={id:voiceId,source,nodes,pointerId,kind};p.voices.set(voiceId,voice);source.onended=()=>{if(!p.voices.has(voiceId))return;p.voices.delete(voiceId);voice.nodes.forEach(n=>{try{n.disconnect()}catch(e){}});renderPads()};source.start(0,offset===null?aa:clamp(offset,aa,bb-.001));renderPads();return voice}
async function startLoop(p){if(!p.buffer||p.loopVoice)return;stopChokeGroup(p);const voice=await startVoice(p,{loop:true,kind:'loop'});if(voice)p.loopVoice=voice.id;renderPads()}
function stopLoop(p){if(!p.loopVoice)return;const id=p.loopVoice;p.loopVoice=null;stopVoice(p,id);renderPads()}
async function previewCurrent(){const p=current();if(!p.buffer)return;if(previewVoice){const old=pads[previewVoice.padId];stopVoice(old,previewVoice.voiceId);previewVoice=null;playBtn.firstChild.textContent='PLAY';return}const voice=await startVoice(p,{loop:p.mode!=='oneshot',kind:'preview'});if(voice){previewVoice={padId:p.id,voiceId:voice.id};playBtn.firstChild.textContent='STOP'}}
function resizeCanvas(){const dpr=Math.max(1,window.devicePixelRatio||1),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawWave()}window.addEventListener('resize',resizeCanvas)
function drawWave(){const p=current(),r=canvas.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);if(!p.buffer)return;const data=p.buffer.getChannelData(0),mid=h/2,step=Math.max(1,Math.floor(data.length/Math.max(1,w)));ctx.strokeStyle='#25321c';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<w;x++){let min=1,max=-1;const from=x*step,to=Math.min(data.length,from+step);for(let i=from;i<to;i++){const v=data[i];if(v<min)min=v;if(v>max)max=v}ctx.moveTo(x,mid+min*mid*.82);ctx.lineTo(x,mid+max*mid*.82)}ctx.stroke()}
function updateTrimUI(){const p=current(),d=duration(p);trimStart.value=Math.round(p.trimStart*1000);trimEnd.value=Math.round(p.trimEnd*1000);trimStartVal.textContent=`${(d*p.trimStart).toFixed(2)}s`;trimEndVal.textContent=`${(d*p.trimEnd).toFixed(2)}s`;trimLeftMask.style.width=`${p.trimStart*100}%`;trimRightMask.style.width=`${(1-p.trimEnd)*100}%`}
function updatePlayhead(pos){const d=duration();playhead.style.left=`${d?clamp(pos/d,0,1)*100:0}%`}
function syncEditor(){const p=current();editorTitle.textContent=`SAMPLE EDIT · ${p.name.toUpperCase()}`;speed.value=p.speed;speedVal.textContent=`${p.speed.toFixed(2)}×`;volume.value=p.volume;volumeVal.textContent=`${Math.round(p.volume*100)}%`;normalizeVal.textContent=`${dbFromGain(p.normalizeGain).toFixed(1)} dB`;filter.value=p.filter;filterVal.textContent=p.filter>=1000?`${(p.filter/1000).toFixed(1)}k`:`${p.filter}`;preset.value=p.preset;chokeGroup.value=String(p.chokeGroup||0);modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===p.mode));fxButtons.forEach(b=>b.classList.toggle('active',!!p.fx[b.dataset.fx]));reverseBtn.classList.toggle('active',p.reversed);empty.style.display=p.buffer?'none':'grid';updateTrimUI();resizeCanvas();updatePlayhead(trimA(p))}
function openEditor(id){activePad=id;editor.classList.add('open');syncEditor()}
backBtn.addEventListener('click',()=>{editor.classList.remove('open');if(previewVoice){const p=pads[previewVoice.padId];stopVoice(p,previewVoice.voiceId);previewVoice=null}playBtn.firstChild.textContent='PLAY';renderPads()})
modeButtons.forEach(button=>button.addEventListener('click',async()=>{const p=current();p.mode=button.dataset.mode;modeButtons.forEach(b=>b.classList.toggle('active',b===button));await dbPut(serialize(p));renderPads()}))
chokeGroup.addEventListener('change',async()=>{const p=current();p.chokeGroup=Number(chokeGroup.value);await dbPut(serialize(p));renderPads()})
reverseBtn.addEventListener('click',async()=>{const p=current();p.reversed=!p.reversed;reverseBtn.classList.toggle('active',p.reversed);await dbPut(serialize(p))})
playBtn.addEventListener('click',previewCurrent)
async function toggleRecord(){const p=current();if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}stopAllVoices(p);await audioCtx.resume();try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));mediaRecorder=preferred?new MediaRecorder(mediaStream,{mimeType:preferred}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{recordBtn.classList.remove('active');recordBtn.firstChild.textContent='REC';mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;const blob=new Blob(chunks,{type:mediaRecorder.mimeType});try{p.blob=blob;p.buffer=await decode(blob);p.trimStart=0;p.trimEnd=1;p.normalizeGain=normalizationGain(p);await dbPut(serialize(p));syncEditor();renderPads();saveState.textContent='saved'}catch(e){saveState.textContent='decode error'}};mediaRecorder.start();recordBtn.classList.add('active');recordBtn.firstChild.textContent='STOP';saveState.textContent='recording'}catch(e){saveState.textContent='mic denied'}}
recordBtn.addEventListener('click',toggleRecord)
trimStart.addEventListener('input',()=>{const p=current();p.trimStart=Math.min(Number(trimStart.value)/1000,p.trimEnd-.01);updateTrimUI()})
trimEnd.addEventListener('input',()=>{const p=current();p.trimEnd=Math.max(Number(trimEnd.value)/1000,p.trimStart+.01);updateTrimUI()})
speed.addEventListener('input',()=>{const p=current();p.speed=Number(speed.value);speedVal.textContent=`${p.speed.toFixed(2)}×`})
volume.addEventListener('input',()=>{const p=current();p.volume=Number(volume.value);volumeVal.textContent=`${Math.round(p.volume*100)}%`})
normalizeBtn.addEventListener('click',async()=>{const p=current();if(!p.buffer)return;p.normalizeGain=normalizationGain(p);normalizeVal.textContent=`${dbFromGain(p.normalizeGain).toFixed(1)} dB`;await dbPut(serialize(p));saveState.textContent='normalized'})
filter.addEventListener('input',()=>{const p=current();p.filter=Number(filter.value);filterVal.textContent=p.filter>=1000?`${(p.filter/1000).toFixed(1)}k`:`${p.filter}`})
preset.addEventListener('change',()=>{current().preset=preset.value})
fxButtons.forEach(button=>button.addEventListener('click',()=>{const p=current(),key=button.dataset.fx;p.fx[key]=!p.fx[key];button.classList.toggle('active',p.fx[key])}))
saveBtn.addEventListener('click',async()=>{await dbPut(serialize(current()));saveState.textContent='saved';renderPads()})
resetFxBtn.addEventListener('click',()=>{const p=current();p.preset='clean';p.fx={reverb:false,echo:false,distortion:false,glitch:false};p.speed=1;p.filter=18000;p.reversed=false;syncEditor()})
clearBtn.addEventListener('click',async()=>{const p=current();stopAllVoices(p);p.blob=null;p.buffer=null;p.trimStart=0;p.trimEnd=1;p.reversed=false;p.volume=1;p.normalizeGain=1;await dbDel(p.id);syncEditor();renderPads();saveState.textContent='cleared'})
exportBtn.addEventListener('click',()=>{const p=current();if(!p.blob)return;const url=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=url;a.download=`pad-${p.id+1}.webm`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})
function scrubFromPointer(e){const p=current();if(!p.buffer)return;const r=waveWrap.getBoundingClientRect(),ratio=clamp((e.clientX-r.left)/r.width,0,1),pos=ratio*duration(p);updatePlayhead(pos)}
waveWrap.addEventListener('pointerdown',e=>{if(!current().buffer)return;scrubbing=true;waveWrap.setPointerCapture(e.pointerId);scrubFromPointer(e)})
waveWrap.addEventListener('pointermove',e=>{if(scrubbing)scrubFromPointer(e)})
waveWrap.addEventListener('pointerup',e=>{if(scrubbing){scrubFromPointer(e);scrubbing=false}})
waveWrap.addEventListener('pointercancel',()=>{scrubbing=false})
document.addEventListener('visibilitychange',()=>{if(document.hidden){pads.forEach(stopAllVoices);pointerToVoice.clear()}})
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))
restore();resizeCanvas()
</script>
</body></html>
