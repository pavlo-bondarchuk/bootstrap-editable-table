<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<title>Touch Sampler 8</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#09090b;color:#fff;overscroll-behavior:none}
body{min-height:100dvh}
button,input,select{font:inherit}
button{border:0;color:#fff;background:#202027;touch-action:manipulation}
button:active{transform:scale(.985)}
button:disabled{opacity:.35}
.app{width:min(100%,820px);margin:auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.title{font-size:22px;font-weight:900}
.sub{font-size:12px;color:#8d8d96;text-align:right}
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pad{position:relative;min-height:132px;border-radius:24px;padding:16px;text-align:left;background:#17171c;border:1px solid #282830;overflow:hidden;user-select:none;touch-action:none}
.pad.loaded{background:#202027}
.pad.playing{outline:3px solid #fff}
.pad-num{font-size:12px;color:#8e8e98;font-weight:800;letter-spacing:.08em}
.pad-name{font-size:22px;font-weight:900;margin-top:12px}
.pad-meta{font-size:11px;color:#9b9ba5;margin-top:8px;padding-right:48px}
.pad-dot{position:absolute;right:16px;top:16px;width:11px;height:11px;border-radius:50%;background:#4a4a53}
.pad.loaded .pad-dot{background:#fff}
.voice-count{position:absolute;left:16px;bottom:14px;font-size:10px;color:#aaa}
.edit{position:absolute;right:12px;bottom:12px;min-height:34px;padding:0 10px;border-radius:11px;background:#34343c;font-size:10px;font-weight:900;display:grid;place-items:center}
.editor{position:fixed;inset:0;z-index:30;background:#0b0b0e;display:none;overflow:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
.editor.open{display:block}
.editor-inner{width:min(100%,820px);margin:auto}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{min-width:86px;min-height:50px;border-radius:16px}
.editor-title{font-size:21px;font-weight:900;text-align:center}
.save-state{font-size:12px;color:#999}
.wave-wrap{position:relative;height:220px;border-radius:24px;background:#151519;border:1px solid #26262d;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#73737d;font-weight:700;padding:24px;text-align:center;pointer-events:none}
.trim-mask{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.58);pointer-events:none}
.trim-left{left:0}.trim-right{right:0}
.playhead{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:0;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.action{min-height:76px;border-radius:20px;font-weight:900}
.action small{display:block;opacity:.65;margin-top:4px}
.rec{background:#8c1722}.rec.active{background:#e21f32}
.primary{background:#efeff2;color:#0b0b0d}
.panel{margin-top:12px;background:#151519;border:1px solid #26262d;border-radius:22px;padding:14px}
.panel-title{font-size:12px;color:#85858e;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.row{display:grid;grid-template-columns:90px 1fr 72px;gap:10px;align-items:center;min-height:48px}
.row+.row{margin-top:6px}
.row label{font-size:13px;font-weight:750}
.value{text-align:right;font-variant-numeric:tabular-nums;color:#aaa}
input[type=range]{width:100%;height:42px;accent-color:#fff}
select{width:100%;min-height:48px;border-radius:14px;border:1px solid #33333b;background:#202027;color:#fff;padding:0 12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{min-height:50px;border-radius:15px;font-size:12px;font-weight:900}
.modes button.active{background:#eee;color:#111}
.fx{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.fx button{min-height:54px;border-radius:16px;font-weight:800}
.fx button.active{background:#eee;color:#111}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bottom button{min-height:58px;border-radius:18px;font-weight:850}
.danger{background:#54171d}
@media(min-width:700px){.pads{grid-template-columns:repeat(4,1fr)}.pad{min-height:160px}.fx{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><div class="title">Touch Sampler 8</div><div style="font-size:12px;color:#777;margin-top:4px">8 незалежних семплерів · multi-touch</div></div>
    <div class="sub">Pad — trigger<br>EDIT — editor</div>
  </div>
  <section class="pads" id="pads"></section>
</main>
<section class="editor" id="editor">
<div class="editor-inner">
  <div class="editor-head"><button class="back" id="backBtn">← Pads</button><div class="editor-title" id="editorTitle">Pad 1</div><div class="save-state" id="saveState">local</div></div>
  <div class="wave-wrap" id="waveWrap"><canvas id="wave"></canvas><div class="trim-mask trim-left" id="trimLeftMask"></div><div class="trim-mask trim-right" id="trimRightMask"></div><div class="playhead" id="playhead"></div><div class="empty" id="empty">Запиши звук для цього паду</div></div>
  <div class="grid"><button class="action" id="reverseBtn">REV<small>reverse</small></button><button class="action rec" id="recordBtn">REC<small>record / stop</small></button><button class="action primary" id="playBtn">PLAY<small>preview / stop</small></button></div>
  <div class="panel"><div class="panel-title">Playback mode</div><div class="modes"><button data-mode="loop">LOOP</button><button data-mode="oneshot">ONE SHOT</button><button data-mode="hold">HOLD</button></div></div>
  <div class="panel"><div class="panel-title">Choke group</div><select id="chokeGroup"><option value="0">Off</option><option value="1">Group 1</option><option value="2">Group 2</option><option value="3">Group 3</option><option value="4">Group 4</option></select></div>
  <div class="panel"><div class="panel-title">Trim</div><div class="row"><label>Start</label><input id="trimStart" type="range" min="0" max="1000" value="0"><div class="value" id="trimStartVal">0.00s</div></div><div class="row"><label>End</label><input id="trimEnd" type="range" min="0" max="1000" value="1000"><div class="value" id="trimEndVal">0.00s</div></div></div>
  <div class="panel"><div class="panel-title">Playback</div><div class="row"><label>Speed</label><input id="speed" type="range" min="0.25" max="2" step="0.01" value="1"><div class="value" id="speedVal">1.00×</div></div><div class="row"><label>Volume</label><input id="volume" type="range" min="0" max="1.5" step="0.01" value="1"><div class="value" id="volumeVal">100%</div></div><div class="row"><label>Filter</label><input id="filter" type="range" min="120" max="18000" step="10" value="18000"><div class="value" id="filterVal">18k</div></div><div class="row"><label>Normalize</label><button id="normalizeBtn" style="min-height:42px;border-radius:12px;font-weight:850">NORMALIZE</button><div class="value" id="normalizeVal">0.0 dB</div></div></div>
  <div class="panel"><div class="panel-title">Voice preset</div><select id="preset"><option value="clean">Clean</option><option value="child">Дитячий голос</option><option value="robot">Робот</option><option value="fish">Риба</option><option value="witch">Стара чаклунка</option></select></div>
  <div class="panel"><div class="panel-title">Effects</div><div class="fx"><button data-fx="reverb">Reverb</button><button data-fx="echo">Echo</button><button data-fx="distortion">Distortion</button><button data-fx="glitch">Glitch</button></div></div>
  <div class="bottom"><button id="saveBtn">SAVE PAD</button><button id="exportBtn">EXPORT AUDIO</button><button class="danger" id="clearBtn">CLEAR</button><button id="resetFxBtn">RESET FX</button></div>
</div>
</section>

reverseBtn.addEventListener('click',async()=>{const p=current();p.reversed=!p.reversed;reverseBtn.classList.toggle('active',p.reversed);await dbPut(serialize(p))})
playBtn.addEventListener('click',previewCurrent)
async function toggleRecord(){const p=current();if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}stopAllVoices(p);await audioCtx.resume();try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));mediaRecorder=preferred?new MediaRecorder(mediaStream,{mimeType:preferred}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{recordBtn.classList.remove('active');recordBtn.firstChild.textContent='REC';mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;const blob=new Blob(chunks,{type:mediaRecorder.mimeType});try{p.blob=blob;p.buffer=await decode(blob);p.trimStart=0;p.trimEnd=1;p.normalizeGain=normalizationGain(p);await dbPut(serialize(p));syncEditor();renderPads();saveState.textContent='saved'}catch(e){saveState.textContent='decode error'}};mediaRecorder.start();recordBtn.classList.add('active');recordBtn.firstChild.textContent='STOP';saveState.textContent='recording'}catch(e){saveState.textContent='mic denied'}}
recordBtn.addEventListener('click',toggleRecord)
trimStart.addEventListener('input',()=>{const p=current();p.trimStart=Math.min(Number(trimStart.value)/1000,p.trimEnd-.01);updateTrimUI()})
trimEnd.addEventListener('input',()=>{const p=current();p.trimEnd=Math.max(Number(trimEnd.value)/1000,p.trimStart+.01);updateTrimUI()})
speed.addEventListener('input',()=>{const p=current();p.speed=Number(speed.value);speedVal.textContent=`${p.speed.toFixed(2)}×`})
volume.addEventListener('input',()=>{const p=current();p.volume=Number(volume.value);volumeVal.textContent=`${Math.round(p.volume*100)}%`})
normalizeBtn.addEventListener('click',async()=>{const p=current();if(!p.buffer)return;p.normalizeGain=normalizationGain(p);normalizeVal.textContent=`${dbFromGain(p.normalizeGain).toFixed(1)} dB`;await dbPut(serialize(p));saveState.textContent='normalized'})
filter.addEventListener('input',()=>{const p=current();p.filter=Number(filter.value);filterVal.textContent=p.filter>=1000?`${(p.filter/1000).toFixed(1)}k`:`${p.filter}`})
preset.addEventListener('change',()=>{current().preset=preset.value})
fxButtons.forEach(button=>button.addEventListener('click',()=>{const p=current(),key=button.dataset.fx;p.fx[key]=!p.fx[key];button.classList.toggle('active',p.fx[key])}))
saveBtn.addEventListener('click',async()=>{await dbPut(serialize(current()));saveState.textContent='saved';renderPads()})
resetFxBtn.addEventListener('click',()=>{const p=current();p.preset='clean';p.fx={reverb:false,echo:false,distortion:false,glitch:false};p.speed=1;p.filter=18000;p.reversed=false;syncEditor()})
clearBtn.addEventListener('click',async()=>{const p=current();stopAllVoices(p);p.blob=null;p.buffer=null;p.trimStart=0;p.trimEnd=1;p.reversed=false;p.volume=1;p.normalizeGain=1;await dbDel(p.id);syncEditor();renderPads();saveState.textContent='cleared'})
exportBtn.addEventListener('click',()=>{const p=current();if(!p.blob)return;const url=URL.createObjectURL(p.blob),link=document.createElement('a');link.href=url;link.download=`pad-${p.id+1}.webm`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})
function scrubFromPointer(e){const p=current();if(!p.buffer)return;const r=waveWrap.getBoundingClientRect(),ratio=clamp((e.clientX-r.left)/r.width,0,1),pos=ratio*duration(p);updatePlayhead(pos)}
waveWrap.addEventListener('pointerdown',e=>{if(!current().buffer)return;scrubbing=true;waveWrap.setPointerCapture(e.pointerId);scrubFromPointer(e)})
waveWrap.addEventListener('pointermove',e=>{if(scrubbing)scrubFromPointer(e)})
waveWrap.addEventListener('pointerup',e=>{if(scrubbing){scrubFromPointer(e);scrubbing=false}})
waveWrap.addEventListener('pointercancel',()=>{scrubbing=false})
document.addEventListener('visibilitychange',()=>{if(document.hidden){pads.forEach(stopAllVoices);pointerToVoice.clear()}})
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))
restore();resizeCanvas()
</script>
</body>
</html>
