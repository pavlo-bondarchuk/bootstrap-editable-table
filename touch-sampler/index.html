<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Touch Sampler</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0b0d;color:#fff;overscroll-behavior:none}
body{min-height:100dvh;display:flex;align-items:stretch;justify-content:center}
.app{width:min(100%,720px);min-height:100dvh;display:grid;grid-template-rows:auto minmax(220px,1fr) auto auto;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:20px;font-weight:800;letter-spacing:.02em}.status{font-size:13px;color:#a6a6ad;text-align:right}
.wave-wrap{position:relative;border-radius:24px;overflow:hidden;background:#151519;border:1px solid #24242a;touch-action:none;min-height:260px}canvas{display:block;width:100%;height:100%}.empty{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;color:#777781;font-weight:650;pointer-events:none}.playhead{position:absolute;top:0;bottom:0;width:3px;left:0;background:#fff;pointer-events:none;transform:translateX(-1.5px);opacity:.9}
.speed{background:#151519;border:1px solid #24242a;border-radius:22px;padding:14px 16px 12px}.speed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.speed-label{font-size:13px;color:#8e8e96;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.speed-value{font-size:28px;font-weight:850;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:white;height:40px;touch-action:none}
.controls{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:12px}button{border:0;min-height:88px;border-radius:24px;font:inherit;font-size:18px;font-weight:850;color:white;background:#202027;touch-action:manipulation}button:active{transform:scale(.98)}button:disabled{opacity:.35}#recordBtn{background:#8a1722}#recordBtn.recording{background:#e02232}#playBtn{background:#ececf0;color:#0c0c0f}#reverseBtn.active{outline:3px solid #fff}.small{font-size:12px;opacity:.7;display:block;margin-top:5px;font-weight:650}@media (max-height:680px){.app{grid-template-rows:auto minmax(160px,1fr) auto auto}.wave-wrap{min-height:180px}button{min-height:72px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="title">Touch Sampler</div><div class="status" id="status">Готово до запису</div></div>
<section class="wave-wrap" id="waveWrap"><canvas id="wave"></canvas><div class="playhead" id="playhead"></div><div class="empty" id="empty">Натисни REC і запиши семпл</div></section>
<section class="speed"><div class="speed-head"><div class="speed-label">Speed</div><div class="speed-value" id="speedValue">1.00×</div></div><input id="speed" type="range" min="0.25" max="2.00" step="0.01" value="1"></section>
<section class="controls"><button id="reverseBtn" disabled>REV<span class="small">reverse</span></button><button id="recordBtn">REC<span class="small">record / stop</span></button><button id="playBtn" disabled>PLAY<span class="small">play / stop</span></button></section>
</main>
<script>
const AudioCtx=window.AudioContext||window.webkitAudioContext
const audioCtx=new AudioCtx()
const recordBtn=document.querySelector('#recordBtn'),playBtn=document.querySelector('#playBtn'),reverseBtn=document.querySelector('#reverseBtn'),speed=document.querySelector('#speed'),speedValue=document.querySelector('#speedValue'),statusEl=document.querySelector('#status'),waveWrap=document.querySelector('#waveWrap'),canvas=document.querySelector('#wave'),empty=document.querySelector('#empty'),playhead=document.querySelector('#playhead'),ctx=canvas.getContext('2d')
let mediaRecorder=null,mediaStream=null,chunks=[],forwardBuffer=null,reverseBuffer=null,source=null,reversed=false,playing=false,startCtxTime=0,startOffset=0,pausedForwardPosition=0,raf=0,scrubbing=false
function setStatus(text){statusEl.textContent=text}
function resizeCanvas(){const dpr=Math.max(1,window.devicePixelRatio||1),rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawWave()}
window.addEventListener('resize',resizeCanvas)
function currentBuffer(){return reversed?reverseBuffer:forwardBuffer}
function bufferDuration(){return forwardBuffer?forwardBuffer.duration:0}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function forwardToBufferPosition(pos){const d=bufferDuration();return reversed?d-pos:pos}
function bufferToForwardPosition(pos){const d=bufferDuration();return reversed?d-pos:pos}
function createReverseBuffer(buffer){const out=audioCtx.createBuffer(buffer.numberOfChannels,buffer.length,buffer.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++){const src=buffer.getChannelData(c),dst=out.getChannelData(c);for(let i=0,j=src.length-1;i<src.length;i++,j--)dst[i]=src[j]}return out}
function drawWave(){const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);if(!forwardBuffer)return;const data=forwardBuffer.getChannelData(0),mid=h/2,step=Math.max(1,Math.floor(data.length/Math.max(1,w)));ctx.strokeStyle='#d8d8de';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<w;x++){let min=1,max=-1;const from=x*step,to=Math.min(data.length,from+step);for(let i=from;i<to;i++){const v=data[i];if(v<min)min=v;if(v>max)max=v}ctx.moveTo(x,mid+min*mid*.82);ctx.lineTo(x,mid+max*mid*.82)}ctx.stroke()}
function updatePlayhead(pos){const d=bufferDuration(),ratio=d?clamp(pos/d,0,1):0;playhead.style.left=`${ratio*100}%`}
function getForwardPosition(){if(!forwardBuffer)return 0;if(!playing)return pausedForwardPosition;const rate=Number(speed.value),elapsed=(audioCtx.currentTime-startCtxTime)*rate,bufferPos=startOffset+elapsed,forwardPos=bufferToForwardPosition(bufferPos);return clamp(forwardPos,0,bufferDuration())}
function stopSource(keepPosition=true){if(!source)return;if(keepPosition)pausedForwardPosition=getForwardPosition();try{source.onended=null;source.stop()}catch(e){}try{source.disconnect()}catch(e){}source=null;playing=false;cancelAnimationFrame(raf);playBtn.firstChild.textContent='PLAY';updatePlayhead(pausedForwardPosition)}
function tick(){if(!playing)return;updatePlayhead(getForwardPosition());raf=requestAnimationFrame(tick)}
async function startPlayback(position=pausedForwardPosition){if(!forwardBuffer)return;await audioCtx.resume();stopSource(false);const d=bufferDuration();pausedForwardPosition=clamp(position,0,d);const bufferPos=clamp(forwardToBufferPosition(pausedForwardPosition),0,Math.max(0,d-.001));source=audioCtx.createBufferSource();source.buffer=currentBuffer();source.playbackRate.value=Number(speed.value);source.connect(audioCtx.destination);startOffset=bufferPos;startCtxTime=audioCtx.currentTime;playing=true;playBtn.firstChild.textContent='STOP';setStatus(reversed?'Відтворення · reverse':'Відтворення');source.onended=()=>{if(!playing)return;playing=false;source=null;cancelAnimationFrame(raf);pausedForwardPosition=reversed?0:d;updatePlayhead(pausedForwardPosition);playBtn.firstChild.textContent='PLAY';setStatus('Зупинено')};source.start(0,bufferPos);tick()}
async function toggleRecord(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}if(playing)stopSource();await audioCtx.resume();try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));mediaRecorder=preferred?new MediaRecorder(mediaStream,{mimeType:preferred}):new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{recordBtn.classList.remove('recording');recordBtn.firstChild.textContent='REC';mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;const blob=new Blob(chunks,{type:mediaRecorder.mimeType}),arr=await blob.arrayBuffer();try{forwardBuffer=await audioCtx.decodeAudioData(arr.slice(0));reverseBuffer=createReverseBuffer(forwardBuffer);pausedForwardPosition=0;reversed=false;reverseBtn.classList.remove('active');playBtn.disabled=false;reverseBtn.disabled=false;empty.style.display='none';resizeCanvas();updatePlayhead(0);setStatus(`${forwardBuffer.duration.toFixed(1)} сек · готово`)}catch(e){setStatus('Не вдалося декодувати запис')}};mediaRecorder.start();recordBtn.classList.add('recording');recordBtn.firstChild.textContent='STOP';setStatus('Запис...')}catch(e){setStatus('Немає доступу до мікрофона')}}
recordBtn.addEventListener('click',toggleRecord)
playBtn.addEventListener('click',async()=>{if(!forwardBuffer)return;if(playing){stopSource();setStatus('Зупинено')}else{if(pausedForwardPosition>=bufferDuration()-.01&&!reversed)pausedForwardPosition=0;if(pausedForwardPosition<=.01&&reversed)pausedForwardPosition=bufferDuration();await startPlayback(pausedForwardPosition)}})
reverseBtn.addEventListener('click',async()=>{if(!forwardBuffer)return;const pos=getForwardPosition(),wasPlaying=playing;if(playing)stopSource(false);pausedForwardPosition=pos;reversed=!reversed;reverseBtn.classList.toggle('active',reversed);setStatus(reversed?'Reverse':'Forward');if(wasPlaying)await startPlayback(pausedForwardPosition)})
speed.addEventListener('input',async()=>{speedValue.textContent=`${Number(speed.value).toFixed(2)}×`;if(playing){const pos=getForwardPosition();await startPlayback(pos)}})
function scrubFromPointer(e){if(!forwardBuffer)return;const rect=waveWrap.getBoundingClientRect(),ratio=clamp((e.clientX-rect.left)/rect.width,0,1);pausedForwardPosition=ratio*bufferDuration();updatePlayhead(pausedForwardPosition)}
waveWrap.addEventListener('pointerdown',async e=>{if(!forwardBuffer)return;scrubbing=true;waveWrap.setPointerCapture(e.pointerId);const wasPlaying=playing;waveWrap.dataset.wasPlaying=wasPlaying?'1':'0';if(playing)stopSource(false);scrubFromPointer(e)})
waveWrap.addEventListener('pointermove',e=>{if(scrubbing)scrubFromPointer(e)})
waveWrap.addEventListener('pointerup',async e=>{if(!scrubbing)return;scrubFromPointer(e);scrubbing=false;if(waveWrap.dataset.wasPlaying==='1')await startPlayback(pausedForwardPosition)})
waveWrap.addEventListener('pointercancel',()=>{scrubbing=false})
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stopSource();setStatus('Зупинено')}})
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
resizeCanvas()
</script>
</body>
</html>
